<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CMP V2 Homepage Implementation Contact Sheet</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #06101b;
        --muted: #59636d;
        --paper: #fffdf8;
        --line: rgba(17, 25, 34, 0.16);
        --blue: #2358a8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f8f2e8;
        color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1440px, calc(100% - 40px));
        margin: 0 auto;
        padding: 34px 0 48px;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 18px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 20px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 34px;
        line-height: 1.1;
      }

      p {
        color: var(--muted);
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        border: 1px solid rgba(35, 88, 168, 0.24);
        border-radius: 4px;
        background: #edf4ff;
        color: var(--blue);
        padding: 0 12px;
        font-weight: 800;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 26px;
      }

      article {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 14px 30px rgba(12, 28, 45, 0.1);
      }

      article h2 {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 16px;
      }

      article h2 span {
        color: var(--muted);
        font-size: 13px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>CMP V2 Homepage Implementation Contact Sheet</h1>
          <p>Before/after captures generated from the protected branch and implementation branch.</p>
        </div>
        <span class="status">Browser validation: pass</span>
      </header>
      <section class="grid" aria-label="Before and after screenshot comparison">
        <article>
          <h2>Before <span>Desktop 1440x1000</span></h2>
          <img src="before-desktop-1440x1000.png" alt="Before desktop homepage screenshot">
        </article>
        <article>
          <h2>After <span>Desktop 1440x1000</span></h2>
          <img src="after-desktop-1440x1000.png" alt="After desktop homepage screenshot">
        </article>
        <article>
          <h2>Before <span>Tablet 1024x900</span></h2>
          <img src="before-tablet-1024x900.png" alt="Before tablet homepage screenshot">
        </article>
        <article>
          <h2>After <span>Tablet 1024x900</span></h2>
          <img src="after-tablet-1024x900.png" alt="After tablet homepage screenshot">
        </article>
        <article>
          <h2>Before <span>Mobile 390x844</span></h2>
          <img src="before-mobile-390x844.png" alt="Before mobile homepage screenshot">
        </article>
        <article>
          <h2>After <span>Mobile 390x844</span></h2>
          <img src="after-mobile-390x844.png" alt="After mobile homepage screenshot">
        </article>
      </section>
    </main>
  </body>
</html>
