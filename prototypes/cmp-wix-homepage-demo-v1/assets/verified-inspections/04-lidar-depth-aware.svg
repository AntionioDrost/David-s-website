<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="260" viewBox="0 0 1440 260" role="img" aria-labelledby="title desc">
  <title id="title">LiDAR-enhanced on compatible Pro devices</title>
  <desc id="desc">Depth-aware where supported banner showing LiDAR-enhanced scanning on compatible iPhone Pro and iPad Pro devices with point-cloud room mesh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101412"/>
      <stop offset="0.52" stop-color="#18201d"/>
      <stop offset="1" stop-color="#202f2b"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="58%" cy="48%" r="56%">
      <stop offset="0" stop-color="#9bd38e" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#9bd38e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202923"/>
      <stop offset="1" stop-color="#0b100e"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff6e8" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="19" flood-color="#000" flood-opacity="0.31"/>
    </filter>
    <style>
      .sans{font-family:Aptos, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}
      .eyebrow{font-size:15px;font-weight:800;letter-spacing:2.4px;fill:#b9d7ad}
      .headline{font-size:40px;font-weight:760;letter-spacing:0;fill:#fff8ec}
      .body{font-size:20px;font-weight:430;fill:#d9dfd6}
      .badgeText{font-size:15px;font-weight:760;fill:#f8f2e8}
    </style>
  </defs>
  <rect width="1440" height="260" fill="url(#bg)"/>
  <rect x="760" y="0" width="680" height="260" fill="url(#meshGlow)"/>
  <rect width="1440" height="260" fill="url(#dots)"/>

  <g class="sans">
    <text class="eyebrow" x="76" y="54">DEPTH-AWARE WHERE SUPPORTED</text>
    <text class="headline" x="76" y="97">LiDAR-enhanced on compatible</text>
    <text class="headline" x="76" y="137">Pro devices</text>
    <text class="body" x="78" y="165">Supported iPhone Pro and iPad Pro models can capture richer spatial context.</text>

    <g transform="translate(76 188)">
      <rect width="126" height="34" rx="17" fill="#fff8eb" fill-opacity="0.12" stroke="#fff8eb" stroke-opacity="0.18"/>
      <circle cx="20" cy="17" r="6" fill="#9bd38e"/>
      <text class="badgeText" x="36" y="22">iPhone 12 Pro+</text>
    </g>
    <g transform="translate(218 188)">
      <rect width="90" height="34" rx="17" fill="#fff8eb" fill-opacity="0.12" stroke="#fff8eb" stroke-opacity="0.18"/>
      <rect x="14" y="10" width="15" height="17" rx="3" fill="none" stroke="#9bd38e" stroke-width="2"/>
      <text class="badgeText" x="39" y="22">iPad Pro</text>
    </g>
    <g transform="translate(323 188)">
      <rect width="126" height="34" rx="17" fill="#fff8eb" fill-opacity="0.12" stroke="#fff8eb" stroke-opacity="0.18"/>
      <path d="M13 21c8-9 17-9 26 0M13 13c8 9 17 9 26 0" fill="none" stroke="#9bd38e" stroke-width="2" stroke-linecap="round"/>
      <text class="badgeText" x="48" y="22">Depth-aware</text>
    </g>
    <text x="78" y="232" font-size="15" font-weight="520" fill="#b6c2b2">LiDAR availability depends on device model.</text>
  </g>

  <g transform="translate(804 22)">
    <g transform="translate(180 20)" opacity="0.95">
      <path d="M0 115 130 28 325 78 432 167 279 202 92 176Z" fill="none" stroke="#fff8eb" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M130 28v118M325 78v91M92 176V84M279 202V116M0 115 92 84 130 28M92 84l187 32 46-38M279 116l153 51M92 176l187 26" fill="none" stroke="#9bd38e" stroke-opacity="0.22" stroke-width="1.6"/>
      <path d="M0 115 130 146 325 169 432 167M92 84l187 32 153 51M130 28l195 50" fill="none" stroke="#fff8eb" stroke-opacity="0.11" stroke-width="1.2"/>
      <g fill="#9bd38e">
        <circle cx="0" cy="115" r="3"/><circle cx="130" cy="28" r="3"/><circle cx="325" cy="78" r="3"/><circle cx="432" cy="167" r="3"/>
        <circle cx="279" cy="202" r="3"/><circle cx="92" cy="176" r="3"/><circle cx="92" cy="84" r="2.6"/><circle cx="130" cy="146" r="2.6"/>
        <circle cx="279" cy="116" r="2.6"/><circle cx="325" cy="169" r="2.6"/>
      </g>
      <g fill="#fff8eb" opacity="0.42">
        <circle cx="49" cy="100" r="1.8"/><circle cx="73" cy="132" r="1.8"/><circle cx="159" cy="92" r="1.8"/><circle cx="221" cy="106" r="1.8"/>
        <circle cx="258" cy="148" r="1.8"/><circle cx="350" cy="142" r="1.8"/><circle cx="368" cy="174" r="1.8"/><circle cx="184" cy="172" r="1.8"/>
      </g>
    </g>

    <g transform="translate(44 0)" filter="url(#shadow)">
      <rect width="190" height="218" rx="34" fill="url(#phone)" stroke="#eef7e7" stroke-opacity="0.18" stroke-width="2"/>
      <rect x="16" y="18" width="158" height="182" rx="24" fill="#101613"/>
      <circle cx="62" cy="66" r="23" fill="#17211c" stroke="#fff8eb" stroke-opacity="0.16" stroke-width="2"/>
      <circle cx="62" cy="66" r="10" fill="#111714" stroke="#9bd38e" stroke-width="3"/>
      <circle cx="111" cy="66" r="23" fill="#17211c" stroke="#fff8eb" stroke-opacity="0.16" stroke-width="2"/>
      <circle cx="111" cy="66" r="10" fill="#111714" stroke="#9bd38e" stroke-width="3"/>
      <circle cx="86" cy="115" r="24" fill="#17211c" stroke="#fff8eb" stroke-opacity="0.16" stroke-width="2"/>
      <circle cx="86" cy="115" r="9" fill="#9bd38e"/>
      <path d="M130 104h22M141 93v22" stroke="#9bd38e" stroke-width="3" stroke-linecap="round"/>
      <rect x="45" y="160" width="100" height="22" rx="11" fill="#fff8eb" fill-opacity="0.1"/>
      <text class="sans" x="63" y="176" font-size="12" font-weight="800" fill="#fff8ec">DEPTH MAP</text>
    </g>
  </g>
</svg>
